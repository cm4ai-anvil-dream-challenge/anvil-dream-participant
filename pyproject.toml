[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "anvil-dream-participant"
version = "0.2.0"
description = "AnVIL DREAM participant CLI, submission tools, and benchmark"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.12"
dependencies = [
    "google-auth>=2.40,<3",
    "google-cloud-storage>=3.1,<4",
    "miniwdl>=1.13,<2",
    "requests>=2.32,<3",
    "synapseclient>=4.14.0,<5",
    "tqdm>=4.66,<5",
]

[project.urls]
Documentation = "https://www.synapse.org/Synapse:syn74338981/wiki/643841"
Repository = "https://github.com/cm4ai-anvil-dream-challenge/anvil-dream-participant"

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "numpy>=1.26,<3",
    "Pillow>=11,<13",
    "tifffile>=2026.9.9,<2027",
    "coverage>=7.6,<8",
    "ruff==0.16.10",
    "twine>=6,<8",
]

[project.scripts]
anvil-dream-participant = "anvil_dream_participant.cli:main"

[tool.setuptools]
include-package-data = false
packages = [
    "anvil_dream_participant",
    "anvil_dream_participant.benchmarking",
    "anvil_dream_participant.cli",
    "anvil_dream_participant.integrations",
    "anvil_dream_participant.submissions",
    "anvil_dream_participant.workflows",
]

[tool.setuptools.package-dir]
anvil_dream_participant = "."

[tool.setuptools.package-data]
"anvil_dream_participant" = [
    "README.md", "docs/container-images.md", "docs/contract.md",
    "docs/proticelli.md", "docs/quickstart.md", "docs/participant-releases.md",
    "examples/proticelli/*.py", "examples/proticelli/*.json",
    "examples/proticelli/*.wdl", "examples/proticelli/*.txt",
    "examples/proticelli/Dockerfile", "examples/proticelli/README.md",
    "examples/proticelli/scripts/*.py", "examples/proticelli/scripts/*.sh",
]
"anvil_dream_participant.benchmarking" = ["README.md"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
