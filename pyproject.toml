[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cm4ai-anvil-dream-participant"
version = "0.1.0"
description = "Public participant submission contracts and bundle tools"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-auth>=2.40,<3",
    "google-cloud-storage>=3.1,<4",
    "miniwdl>=1.13,<2",
    "requests>=2.32,<3",
    "synapseclient>=4.14.0,<5",
    "tqdm>=4.66,<5",
]

[project.urls]
Repository = "https://github.com/cm4ai-anvil-dream-challenge/cm4ai-anvil-dream-tools"

[project.scripts]
dream = "dream_participant.cli:main"

[tool.setuptools]
packages = [
    "dream_participant",
    "dream_participant.benchmarking",
    "dream_participant.cli",
    "dream_participant.integrations",
    "dream_participant.submissions",
    "dream_participant.workflows",
]

[tool.setuptools.package-dir]
dream_participant = "."

[tool.setuptools.package-data]
"dream_participant.benchmarking" = ["README.md"]
