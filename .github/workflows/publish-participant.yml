name: Publish participant package

"on":
  push:
    tags:
      - "participant-v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: participant-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate participant release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate release identity
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import tomllib

          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          assert project["name"] == "anvil-dream-participant"
          if os.environ["GITHUB_REF_TYPE"] == "tag":
              expected = "participant-v" + project["version"]
              assert os.environ["GITHUB_REF_NAME"] == expected, (
                  f"release tag must match participant version {expected}"
              )
          PY

      - name: Install, test, and lint participant source
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install '.[dev]'
          python -m ruff check .
          python -B -m unittest discover -s tests -t . -v
          python -c 'import importlib.util; assert importlib.util.find_spec("organizer") is None'
          anvil-dream-participant --help
          anvil-dream-participant submit --help

      - name: Build and verify public distributions
        run: |
          python -m build --outdir "$RUNNER_TEMP/participant-dist"
          python -m twine check --strict "$RUNNER_TEMP/participant-dist/"*
          python -B tests/integration/packaging/verify_public_artifacts.py \
            "$RUNNER_TEMP/participant-dist/"*.whl \
            "$RUNNER_TEMP/participant-dist/"*.tar.gz

      - name: Smoke the installed wheel
        run: |
          python -m venv "$RUNNER_TEMP/participant-wheel-venv"
          "$RUNNER_TEMP/participant-wheel-venv/bin/python" \
            -m pip install "$RUNNER_TEMP/participant-dist/"*.whl
          "$RUNNER_TEMP/participant-wheel-venv/bin/python" -m pip check
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/participant-wheel-venv/bin/python" -B \
            "$GITHUB_WORKSPACE/tests/integration/packaging/smoke_participant_wheel.py" \
            "$GITHUB_WORKSPACE/examples/proticelli/participant.wdl"

      - name: Save validated distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: participant-distributions
          path: ${{ runner.temp }}/participant-dist/*
          if-no-files-found: error

  publish:
    name: Upload participant release to PyPI
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/participant-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi-participant
      url: https://pypi.org/project/anvil-dream-participant/
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: participant-distributions
          path: dist/

      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
